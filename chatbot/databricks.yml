  name: "chatbot"

include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-12fe94fd-e135.cloud.databricks.com

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-12fe94fd-e135.cloud.databricks.com
      # We always use /Users/lyubomir.lirkov@telefonicatech.uk for all resources to make sure we only have a single copy.
      root_path: /Users/lyubomir.lirkov@telefonicatech.uk/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as lyubomir.lirkov@telefonicatech.uk in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: lyubomir.lirkov@telefonicatech.uk
