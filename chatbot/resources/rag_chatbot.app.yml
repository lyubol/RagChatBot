# RAG chatbot app: Streamlit UI over the Vector Search index built by the
# pdf_rag_ingestion job. Deployed as a Databricks App from this bundle —
# `bundle deploy` creates the app (first time) and deploys its source from
# src/app on every deploy.
#
# Note: app names are workspace-global, lowercase/digits/hyphens, max 30 chars.
# A fixed name is used because the per-developer template
# (${workspace.current_user.domain_friendly_name}) would exceed the limit here.
resources:
  apps:
    rag_chatbot:
      name: pdf-rag-chatbot-dev
      description: 'RAG chatbot over the PDF Vector Search index (built-in AI functions pipeline)'
      source_code_path: ../src/app